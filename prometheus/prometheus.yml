global:
  scrape_interval: 15s

scrape_configs:
  # 1. Java Application
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8090']

  # 2. Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  # 3. Kafka Exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka_exporter:9308']

  # 4. Postgres Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: [ 'postgres_exporter:9187' ]